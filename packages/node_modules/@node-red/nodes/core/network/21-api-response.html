<script type="text/javascript">
    RED.nodes.registerType('api-response', {
        category: 'network',
        color: '#87CEEB',
        defaults: {
            name: {value: ""},
            statusCode: {value: 200, validate: function(v) {
                return (v >= 100 && v <= 599);
            }},
            headers: {value: {}}
        },
        inputs: 1,
        outputs: 1,
        icon: "white-globe.svg",
        align: "right",
        label: function() {
            return this.name || `API Response (${this.statusCode})`;
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function() {
            var headersList = $("#node-input-headers-container");
            var node = this;
            
            function generateHeaderRow(key, value) {
                var container = $('<div/>', {style:"margin-bottom:5px;"});
                var row = $('<div/>').appendTo(container);
                
                var keyField = $('<input/>', {
                    type: "text",
                    placeholder: "Header name",
                    style: "width:40%; margin-right:10px;",
                    value: key
                }).appendTo(row);
                
                var valueField = $('<input/>', {
                    type: "text", 
                    placeholder: "Header value",
                    style: "width:40%; margin-right:10px;",
                    value: value
                }).appendTo(row);
                
                var deleteButton = $('<button/>', {
                    type: "button",
                    class: "red-ui-button red-ui-button-small",
                    style: "margin-left:5px;"
                }).html('<i class="fa fa-trash"></i>').appendTo(row);
                
                deleteButton.click(function() {
                    container.remove();
                });
                
                return container;
            }
            
            // Populate existing headers
            if (this.headers) {
                for (var key in this.headers) {
                    if (this.headers.hasOwnProperty(key)) {
                        headersList.append(generateHeaderRow(key, this.headers[key]));
                    }
                }
            }
            
            // Add header button
            $("#node-input-add-header").click(function() {
                headersList.append(generateHeaderRow("", ""));
            });
            
            // Quick preset buttons
            $("#preset-cors").click(function() {
                headersList.append(generateHeaderRow("Access-Control-Allow-Origin", "*"));
                headersList.append(generateHeaderRow("Access-Control-Allow-Methods", "GET, POST, PUT, DELETE, OPTIONS"));
                headersList.append(generateHeaderRow("Access-Control-Allow-Headers", "Content-Type, Authorization"));
            });
            
            $("#preset-cache").click(function() {
                headersList.append(generateHeaderRow("Cache-Control", "no-cache, no-store, must-revalidate"));
                headersList.append(generateHeaderRow("Pragma", "no-cache"));
                headersList.append(generateHeaderRow("Expires", "0"));
            });
        },
        oneditsave: function() {
            var headers = {};
            var headerContainer = $("#node-input-headers-container");
            
            headerContainer.find("div").each(function() {
                var inputs = $(this).find("input");
                if (inputs.length === 2) {
                    var key = $(inputs[0]).val().trim();
                    var value = $(inputs[1]).val().trim();
                    if (key && value) {
                        headers[key] = value;
                    }
                }
            });
            
            this.headers = headers;
        }
    });
</script>

    <div class="form-row">

    <div class="form-row">

        <select id="node-input-statusCode" style="width:70%;">

            <option value="201">201 - Created</option>

        <div id="node-input-headers-container" style="margin-left: 105px; min-height: 100px; border: 1px solid #ccc; border-radius: 3px; padding: 10px;">

    </div>
</script>

<script type="text/html" data-help-name="api-response">
    <p>Helper node to send HTTP responses back to API Endpoint nodes with proper formatting and headers.</p>
    
    <h3>Usage</h3>
    <p>Place this node at the end of your API flow to send the response back to the client:</p>
    <pre>
[API Endpoint] → [Business Logic] → [API Response]
     |                                     ↑
     └─────────────── (wire back) ─────────┘
    </pre>
    
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Status Code <span class="property-type">number</span></dt>
        <dd>HTTP status code to send (can be overridden by <code>msg.statusCode</code>)</dd>
        
        <dt>Headers <span class="property-type">object</span></dt>
        <dd>HTTP headers to include in the response (merged with <code>msg.headers</code>)</dd>
    </dl>

    <h3>Input Message Properties</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>The response data to send to the client</dd>
        
        <dt class="optional">statusCode <span class="property-type">number</span></dt>
        <dd>Override the configured status code</dd>
        
        <dt class="optional">headers <span class="property-type">object</span></dt>
        <dd>Additional headers to include (merged with configured headers)</dd>
        
        <dt>_httpReq <span class="property-type">object</span></dt>
        <dd>Original HTTP request object (automatically preserved from API Endpoint)</dd>
        
        <dt>_httpRes <span class="property-type">object</span></dt>
        <dd>Original HTTP response object (automatically preserved from API Endpoint)</dd>
        
        <dt>_msgid <span class="property-type">string</span></dt>
        <dd>Message ID (automatically preserved from API Endpoint)</dd>
    </dl>

    <h3>Response Flow</h3>
    <p>This node automatically:</p>
    <ul>
        <li>Sets <code>msg._isResponse = true</code> to mark the message as a response</li>
        <li>Ensures proper Content-Type header (defaults to application/json)</li>
        <li>Merges configured headers with message headers</li>
        <li>Preserves HTTP context for proper response routing</li>
    </ul>

    <h3>Example Flow</h3>
    <pre>
// Your TypeScript function node
export default function(msg: NodeMessage): NodeMessage {
    // Process the request
    const result = {
        id: generateId(),
        data: processData(msg.payload),
        timestamp: new Date()
    };
    
    // Return to API Response node
    return {
        ...msg,           // Preserve HTTP context
        payload: result,  // Response data
        statusCode: 201   // Optional status override
    };
}
    </pre>

    <h3>Header Presets</h3>
    <ul>
        <li><strong>CORS Headers</strong>: Adds Access-Control headers for cross-origin requests</li>
        <li><strong>No-Cache Headers</strong>: Prevents caching of the response</li>
    </ul>
</script>
