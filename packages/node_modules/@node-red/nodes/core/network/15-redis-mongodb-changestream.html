<!-- Help Documentation -->
<script type="text/html" data-help-name="redis-mongodb-changestream">
    <p>Reads MongoDB change streams and publishes changes to Redis streams with distributed locking.</p>
    
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>MongoDB Config <span class="property-type">mongodb-config</span></dt>
        <dd>MongoDB connection configuration including URI, database, and collection</dd>
        
        <dt>Redis Config <span class="property-type">redis-config</span></dt>
        <dd>Redis connection configuration for stream publishing</dd>
        
        <dt>Stream Name <span class="property-type">string</span></dt>
        <dd>Name of the Redis stream to publish changes to</dd>
        
        <dt>Lock Key <span class="property-type">string</span></dt>
        <dd>Redis key used for distributed locking to ensure only one instance processes changes</dd>
        
        <dt>Lock Timeout <span class="property-type">number</span></dt>
        <dd>Lock timeout in milliseconds (default: 60000)</dd>
        
        <dt>Pipeline <span class="property-type">json</span></dt>
        <dd>MongoDB aggregation pipeline to filter change events</dd>
    </dl>
    
    <h3>Features</h3>
    <p>This node automatically starts monitoring MongoDB change streams when deployed and publishes changes directly to Redis streams. It acts as a pure bridge with no outputs - all data flows through Redis.</p>
    
    <h3>Behavior</h3>
    <ul>
        <li>Monitors MongoDB change streams continuously</li>
        <li>Publishes changes directly to Redis streams</li>
        <li>Uses distributed locking to prevent duplicate processing</li>
        <li>No outputs - data flows through Redis streams only</li>
    </ul>
</script>

<script type="text/html" data-help-name="redis-stream-worker">
    <p>Creates Redis consumer groups and processes stream messages with automatic acknowledgment support.</p>
    
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Redis Config <span class="property-type">redis-config</span></dt>
        <dd>Redis connection configuration</dd>
        
        <dt>Stream Name <span class="property-type">string</span></dt>
        <dd>Name of the Redis stream to consume from</dd>
        
        <dt>Consumer Group <span class="property-type">string</span></dt>
        <dd>Redis consumer group name</dd>
        
        <dt>Consumer Name <span class="property-type">string</span></dt>
        <dd>Unique consumer name (auto-generated if empty)</dd>
        
        <dt>Block Timeout <span class="property-type">number</span></dt>
        <dd>Maximum time to wait for new messages in milliseconds</dd>
        
        <dt>Batch Size <span class="property-type">number</span></dt>
        <dd>Number of messages to read in each batch</dd>
    </dl>
    
    <h3>Features</h3>
    <p>This node automatically creates consumer groups and starts consuming messages when deployed. Messages are NOT automatically acknowledged - use the Redis Stream Ack node for acknowledgment control.</p>
    
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The change event data from MongoDB</dd>
        
        <dt>messageId <span class="property-type">string</span></dt>
        <dd>Redis stream message ID</dd>
        
        <dt>ack <span class="property-type">function</span></dt>
        <dd>Function to call to acknowledge message processing</dd>
        
        <dt>operationType <span class="property-type">string</span></dt>
        <dd>MongoDB operation type (insert, update, delete, etc.)</dd>
    </dl>
    
    <h3>Usage Example</h3>
    <p>To acknowledge a message after processing:</p>
    <pre>
// In a function node connected to the worker output
if (msg.ack) {
    // Process the message
    console.log("Processing:", msg.payload);
    
    // Acknowledge the message
    msg.ack();
}
return msg;
    </pre>
</script>

<!-- Redis Stream Ack Node -->
<script type="text/html" data-template-name="redis-stream-ack">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]common.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-ackMode"><i class="fa fa-cog"></i> <span>Ack Mode</span></label>
        <select id="node-input-ackMode">
            <option value="auto">Auto - Always acknowledge</option>
            <option value="manual">Manual - Only if msg.shouldAck is true</option>
            <option value="conditional">Conditional - Use JSONata expression</option>
        </select>
    </div>
    <div class="form-row" id="ack-condition-row" style="display: none;">
        <label for="node-input-condition"><i class="fa fa-code"></i> <span>Condition (JSONata)</span></label>
        <input type="text" id="node-input-condition" placeholder="$exists(payload.success) and payload.success = true">
        <div class="form-tips">
            <p>Examples:</p>
            <ul>
                <li><code>payload.success = true</code> - Ack if processing was successful</li>
                <li><code>$not($exists(error))</code> - Ack if no error field exists</li>
                <li><code>payload.retryCount < 3</code> - Ack if retry count is less than 3</li>
            </ul>
        </div>
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('redis-stream-ack', {
        category: 'node-purple',
        color: "#E6E6FA",
        defaults: {
            name: {value: ""},
            ackMode: {value: "auto"},
            condition: {value: ""}
        },
        inputs: 1,
        outputs: 1,
        icon: "arrow-in.svg",
        label: function() {
            return this.name || "";
        },
        oneditprepare: function() {
            const ackModeSelect = $("#node-input-ackMode");
            const conditionRow = $("#ack-condition-row");
            
            // Show/hide condition row based on ack mode
            ackModeSelect.change(function() {
                if ($(this).val() === "conditional") {
                    conditionRow.show();
                } else {
                    conditionRow.hide();
                }
            });
            
            // Trigger change event to set initial state
            ackModeSelect.trigger('change');
        }
    });
</script>

<script type="text/html" data-help-name="redis-stream-ack">
    <p>Acknowledges Redis stream messages with configurable conditions.</p>
    
    <h3>Features</h3>
    <ul>
        <li><strong>Pass-through</strong> - Always forwards the message to the next node</li>
        <li><strong>Multiple ack modes</strong> - Auto, manual, or conditional acknowledgment</li>
        <li><strong>Safe error handling</strong> - Continues flow even if ack fails</li>
        <li><strong>Status indicators</strong> - Visual feedback on acknowledgment status</li>
    </ul>
    
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Ack Mode <span class="property-type">string</span></dt>
        <dd>
            <ul>
                <li><strong>Auto</strong> - Always acknowledges messages</li>
                <li><strong>Manual</strong> - Only acknowledges if <code>msg.shouldAck</code> is true</li>
                <li><strong>Conditional</strong> - Uses JSONata expression to determine acknowledgment</li>
            </ul>
        </dd>
        
        <dt>Condition <span class="property-type">JSONata</span></dt>
        <dd>JSONata expression that returns true/false for conditional acknowledgment</dd>
    </dl>
    
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>ack <span class="property-type">function</span></dt>
        <dd>Redis stream acknowledgment function (from Redis Stream Worker)</dd>
        
        <dt>shouldAck <span class="property-type">boolean</span></dt>
        <dd>Manual trigger for acknowledgment (when using manual mode)</dd>
    </dl>
    
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>acknowledged <span class="property-type">boolean</span></dt>
        <dd>Whether the message was successfully acknowledged</dd>
        
        <dt>acknowledgedAt <span class="property-type">string</span></dt>
        <dd>ISO timestamp of when acknowledgment occurred</dd>
        
        <dt>ackError <span class="property-type">string</span></dt>
        <dd>Error message if acknowledgment failed</dd>
    </dl>
    
    <h3>Flow Examples</h3>
    
    <h4>Success/Error Split Flow:</h4>
    <pre>
Redis Stream Worker → Process → Switch (on success)
                              ├─ Success → Ack Node → Log Success
                              └─ Error → Log Error (no ack = retry)
    </pre>
    
    <h4>Conditional Acknowledgment:</h4>
    <pre>
Redis Stream Worker → Process → Ack Node (conditional) → Continue
                              
Condition: payload.retryCount < 3
    </pre>
    
    <h4>Manual Control:</h4>
    <pre>
Redis Stream Worker → Function Node → Ack Node (manual) → Next
                      ↓
                      Set msg.shouldAck = true/false based on logic
    </pre>
</script>
