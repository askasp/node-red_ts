<script type="text/javascript">
    RED.nodes.registerType('api-endpoint', {
        category: 'network',
        color: '#87CEEB',
        defaults: {
            name: {value: ""},
            method: {value: "GET", required: true},
            url: {value: "", required: true, validate: function(v) {
                return v.length > 0 && v.startsWith('/');
            }},
            schemaFile: {value: ""},
            inputSchemaName: {value: ""},
            outputSchemaName: {value: ""},
            description: {value: ""},
            tags: {value: ""}
        },
        inputs: 1,
        outputs: 1,
        icon: "white-globe.svg",
        label: function() {
            return this.name || `${this.method} ${this.url}`;
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function() {
            const node = this;
            
            // Validate schema configuration in real-time
            function validateSchemas() {
                const schemaFile = $('#node-input-schemaFile').val();
                const inputSchema = $('#node-input-inputSchemaName').val();
                const outputSchema = $('#node-input-outputSchemaName').val();
                
                if (schemaFile && (inputSchema || outputSchema)) {
                    // Check if schema file exists and has the requested exports
                    $.ajax({
                        url: 'function/typescript/validate-schema',
                        method: 'POST',
                        data: JSON.stringify({
                            schemaFile: schemaFile,
                            inputSchema: inputSchema,
                            outputSchema: outputSchema
                        }),
                        contentType: 'application/json',
                        success: function(result) {
                            if (result.valid) {
                                $('#schema-validation-status').html('✅ Schemas found').css('color', 'green');
                                $('#schema-details').html(
                                    `<small>Input: ${result.inputSchemaType || 'none'}<br>` +
                                    `Output: ${result.outputSchemaType || 'none'}</small>`
                                );
                            } else {
                                $('#schema-validation-status').html('❌ ' + result.error).css('color', 'red');
                                $('#schema-details').html('');
                            }
                        },
                        error: function() {
                            $('#schema-validation-status').html('⚠️ Could not validate schemas').css('color', 'orange');
                        }
                    });
                } else {
                    $('#schema-validation-status').html('');
                    $('#schema-details').html('');
                }
            }
            
            // Add validation status display after the output schema input
            $('#node-input-outputSchemaName').after(`
                <div id="schema-validation-status" style="margin-top: 5px; font-weight: bold;"></div>
                <div id="schema-details" style="margin-top: 5px; color: #666;"></div>
            `);
            
            // Validate on change
            $('#node-input-schemaFile, #node-input-inputSchemaName, #node-input-outputSchemaName').on('change keyup', function() {
                clearTimeout(this.validateTimeout);
                this.validateTimeout = setTimeout(validateSchemas, 500);
            });
            
            // Help button for OpenAPI docs
            $('#node-input-url').after(`
                <button type="button" id="openapi-docs-btn" class="red-ui-button red-ui-button-small" style="margin-left: 10px;">
                    <i class="fa fa-book"></i> View API Docs
                </button>
            `);
            
            $('#openapi-docs-btn').click(function(e) {
                e.preventDefault();
                window.open('/openapi/ui', '_blank');
            });
            
            // Initial validation
            setTimeout(validateSchemas, 100);
        },
        oneditsave: function() {
            // Final validation before save
            const schemaFile = $('#node-input-schemaFile').val();
            const inputSchema = $('#node-input-inputSchemaName').val();
            const outputSchema = $('#node-input-outputSchemaName').val();
            
            if (schemaFile && (inputSchema || outputSchema)) {
                const status = $('#schema-validation-status').text();
                if (status.includes('❌')) {
                    RED.notify('Cannot save: Schema validation failed', 'error');
                    return false; // Prevent save
                }
            }
            return true;
        }
    });
</script>

<script type="text/html" data-help-name="api-endpoint">
    <p>Creates an HTTP API endpoint with automatic Zod schema validation and OpenAPI specification generation.</p>
    
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Method <span class="property-type">string</span></dt>
        <dd>HTTP method (GET, POST, PUT, PATCH, DELETE)</dd>
        
        <dt>URL <span class="property-type">string</span></dt>
        <dd>API endpoint path (must start with /)</dd>
        
        <dt>Schema File <span class="property-type">string</span></dt>
        <dd>Path to TypeScript file containing Zod schemas (e.g., @userDir/src/schemas/profile)</dd>
        
        <dt>Input Schema <span class="property-type">string</span></dt>
        <dd>Name of exported Zod schema for request validation</dd>
        
        <dt>Output Schema <span class="property-type">string</span></dt>
        <dd>Name of exported Zod schema for response validation</dd>
    </dl>

    <h3>Flow Design</h3>
    <p>This node works in a round-trip pattern:</p>
    <ol>
        <li><strong>Request</strong>: HTTP request comes in → validates input → sends to business logic</li>
        <li><strong>Processing</strong>: Your business logic nodes process the request</li>
        <li><strong>Response</strong>: Result comes back → validates output → sends HTTP response</li>
    </ol>

    <h3>Usage Pattern</h3>
    <pre>
[API Endpoint] → [Your TypeScript Logic] → [API Endpoint]
     |                                           ↑
     └─── validates input                validates output ───┘
    </pre>

    <h3>Response Handling</h3>
    <p>To send the response back through this node, ensure your business logic:</p>
    <ul>
        <li>Preserves the <code>_msgid</code>, <code>_httpReq</code>, and <code>_httpRes</code> properties</li>
        <li>Sets <code>msg._isResponse = true</code> on the return message</li>
        <li>Puts the response data in <code>msg.payload</code></li>
    </ul>

    <h3>Example Business Logic</h3>
    <pre>
// In your TypeScript function node
export default function(msg: NodeMessage): NodeMessage {
    // Process the validated input
    const result = processUser(msg.payload);
    
    // Return response through the API endpoint
    return {
        ...msg,                    // Preserve HTTP context
        _isResponse: true,         // Mark as response
        payload: result,           // Your response data
        statusCode: 201           // Optional status code
    };
}
    </pre>

    <h3>OpenAPI Documentation</h3>
    <p>This node automatically:</p>
    <ul>
        <li>Registers the endpoint in the OpenAPI specification</li>
        <li>Converts Zod schemas to OpenAPI schemas</li>
        <li>Generates request/response documentation</li>
    </ul>
    
    <p>View the generated API documentation at: <a href="/openapi/ui" target="_blank">/openapi/ui</a></p>
    <p>Access the raw OpenAPI spec at: <a href="/openapi/spec" target="_blank">/openapi/spec</a></p>

    <h3>Schema File Example</h3>
    <pre>
// @userDir/src/schemas/profile.ts
import { z } from 'zod';

export const createProfileSchema = z.object({
    name: z.string().min(1),
    email: z.string().email(),
    age: z.number().optional()
});

export const profileViewSchema = z.object({
    id: z.string(),
    name: z.string(),
    email: z.string(),
    age: z.number().optional(),
    createdAt: z.date()
});
    </pre>
</script>
