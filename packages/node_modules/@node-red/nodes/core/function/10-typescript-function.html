<script type="text/javascript">
    // Embedded TypeScript support for TypeScript function nodes
    (function() {
        // Ensure RED.editor.types namespace exists
        if (!RED.editor.types) {
            RED.editor.types = {};
        }
        
        // Initialize TypeScript support
        if (!RED.editor.types.typescript) {
            console.log('[TS-Function] Initializing TypeScript support...');
            
            RED.editor.types.typescript = (function() {
                const loadedTypes = new Set();
                
                function init() {
                    if (!window.monaco) {
                        console.warn("[TS] Monaco editor not loaded");
                        return;
                    }
                    
                    console.log('[TS] Configuring TypeScript for dedicated TS function node...');
                    
                    // Configure TypeScript with strict type checking
                    monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
                        target: monaco.languages.typescript.ScriptTarget.ES2020,
                        module: monaco.languages.typescript.ModuleKind.CommonJS,
                        moduleResolution: monaco.languages.typescript.ModuleResolutionKind.NodeJs,
                        esModuleInterop: true,
                        allowSyntheticDefaultImports: true,
                        strict: true,
                        noImplicitAny: true,
                        strictNullChecks: true,
                        strictPropertyInitialization: false,
                        allowJs: false // Pure TypeScript only
                    });
                    
                    // Enable strict diagnostics with minimal exceptions
                    monaco.languages.typescript.typescriptDefaults.setDiagnosticsOptions({
                        noSemanticValidation: false,
                        noSyntaxValidation: false,
                        noSuggestionDiagnostics: false,
                        diagnosticCodesToIgnore: [] // Don't ignore any errors for strict checking
                    });
                    
                    addNodeRedTypes();
                    loadUserDirTypes();
                }
                
                function addNodeRedTypes() {
                    const nodeRedTypes = `
declare global {
    interface NodeMessage {
        payload: any;
        topic?: string;
        _msgid?: string;
        [key: string]: any;
    }

    interface NodeSend {
        (msg: NodeMessage | NodeMessage[] | NodeMessage[][]): void;
    }

    interface NodeDone {
        (error?: Error): void;
    }

    interface NodeContext {
        get(key: string): any;
        set(key: string, value: any): void;
        keys(): string[];
        global: {
            get(key: string): any;
            set(key: string, value: any): void;
            keys(): string[];
        };
        flow: {
            get(key: string): any;
            set(key: string, value: any): void;
            keys(): string[];
        };
    }

    interface Node {
        id: string;
        name: string;
        outputCount: number;
        log(...args: any[]): void;
        warn(...args: any[]): void;
        error(...args: any[]): void;
        debug(...args: any[]): void;
        trace(...args: any[]): void;
        status(status: {fill?: string, shape?: string, text?: string}): void;
        send: NodeSend;
        done: NodeDone;
    }

    // Strict typing for Node-RED globals
    declare const msg: NodeMessage;
    declare const send: NodeSend;
    declare const done: NodeDone;
    declare const node: Node;
    declare const context: NodeContext;
    declare const flow: NodeContext['flow'];
    declare const global: NodeContext['global'];
    declare const env: { get(key: string): string | undefined };
    
    declare function requireUserDir(module: string): any;
    
    // TypeScript function signature for exported functions
    type NodeRedFunction = (
        msg: NodeMessage,
        send?: NodeSend,
        done?: NodeDone,
        node?: Node,
        context?: NodeContext,
        flow?: NodeContext['flow'],
        global?: NodeContext['global'],
        env?: { get(key: string): string | undefined }
    ) => NodeMessage | NodeMessage[] | null | undefined | Promise<NodeMessage | NodeMessage[] | null | undefined>;
}

// Module declarations for userDir imports
declare module "@userDir/lib/helpers" {
    export interface DataSchema {
        id: string;
        value: number;
        timestamp?: number;
        metadata?: Record<string, any>;
    }
    
    export function processData(data: any): any;
    export function validateData(data: any): data is DataSchema;
    export function transformData(data: any, schema: any): any;
    export function formatMessage(message: string, ...args: any[]): string;
    export function delay(ms: number): Promise<void>;
    export function getProperty<T>(obj: any, path: string): T | undefined;
    
    export class Logger {
        constructor(prefix?: string);
        info(message: string, ...args: any[]): void;
        warn(message: string, ...args: any[]): void;
        error(message: string, ...args: any[]): void;
    }
    
    export const logger: Logger;
    export const userSchema: any;
    
    export namespace Temperature {
        export function celsiusToFahrenheit(celsius: number): number;
        export function fahrenheitToCelsius(fahrenheit: number): number;
    }
    
    export type MessagePayload = string | number | boolean | object | null;
    
    export interface ProcessedMessage {
        originalPayload: MessagePayload;
        processedPayload: MessagePayload;
        processingTime: number;
        metadata: Record<string, any>;
    }
}

export {};
                    `;
                    
                    monaco.languages.typescript.typescriptDefaults.addExtraLib(
                        nodeRedTypes,
                        'file:///node-red-types.d.ts'
                    );
                    loadedTypes.add('node-red-types');
                }
                
                async function loadUserDirTypes() {
                    try {
                        const listResponse = await fetch('function/typescript/userdir-list');
                        if (!listResponse.ok) return [];
                        
                        const { files } = await listResponse.json();
                        console.log(`[TS] Found ${files.length} TypeScript files in userDir`);
                        
                        for (const file of files) {
                            try {
                                const response = await fetch(`function/typescript/userdir/${file.fullPath}`);
                                if (response.ok) {
                                    const content = await response.text();
                                    
                                    // Add as module declaration
                                    const moduleDeclaration = `
declare module "@userDir/${file.fullPath.replace(/\.(ts|tsx)$/, '')}" {
${content.replace(/^export /gm, '    export ')}
}`;
                                    
                                    monaco.languages.typescript.typescriptDefaults.addExtraLib(
                                        moduleDeclaration,
                                        `file:///userDir-${file.path.replace(/[\/\\]/g, '-')}.d.ts`
                                    );
                                    
                                    console.log(`[TS] Added module: @userDir/${file.fullPath.replace(/\.(ts|tsx)$/, '')}`);
                                }
                            } catch (err) {
                                console.error(`[TS] Error loading ${file.path}:`, err);
                            }
                        }
                        return files;
                    } catch (error) {
                        console.error('[TS] Error loading userDir types:', error);
                        return [];
                    }
                }
                
                // Initialize when Monaco is ready
                if (window.monaco) {
                    init();
                } else {
                    const checkMonaco = setInterval(() => {
                        if (window.monaco) {
                            clearInterval(checkMonaco);
                            init();
                        }
                    }, 100);
                }
                
                return { init, loadUserDirTypes };
            })();
        }
    })();
</script>

<script type="text/javascript">
    RED.nodes.registerType('typescript-function', {
        color: "#87CEEB",
        category: 'function',
        defaults: {
            name: {value: ""},
            func: {value: "// TypeScript function\nimport { processData } from '@userDir/lib/helpers';\n\ninterface CustomMessage extends NodeMessage {\n    data: number;\n}\n\nexport default function(msg: NodeMessage): NodeMessage {\n    const customMsg = msg as CustomMessage;\n    \n    // Process the message\n    const result = processData(customMsg.payload);\n    \n    customMsg.payload = {\n        result: result,\n        timestamp: Date.now()\n    };\n    \n    return customMsg;\n}"},
            compiledFunc: {value: ""}, // Store the compiled JavaScript
            compilationErrors: {value: []}, // Store compilation errors
            outputs: {value: 1},
            initialize: {value: ""},
            finalize: {value: ""},
            libs: {value: []}
        },
        inputs: 1,
        outputs: 1,
        icon: "function.svg",
        label: function() {
            return this.name || "TS function";
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function() {
            var that = this;
            console.log('[TS-Function] oneditprepare called');
            
            // Build TypeScript editor with proper configuration
            var buildEditor = function(element, value) {
                console.log('[TS-Function] Building TypeScript editor...');
                
                // Create a proper TypeScript model with .ts extension
                const modelUri = monaco.Uri.parse('file:///typescript-function.ts');
                let model = monaco.editor.getModel(modelUri);
                
                if (model) {
                    model.dispose(); // Remove existing model
                }
                
                // Create new TypeScript model
                model = monaco.editor.createModel(value, 'typescript', modelUri);
                console.log('[TS-Function] Created TypeScript model with URI:', modelUri.toString());
                
                var editor = RED.editor.createEditor({
                    element: element,
                    model: model,
                    minimap: { enabled: false },
                    fontSize: 14,
                    scrollBeyondLastLine: false,
                    automaticLayout: true,
                    language: 'typescript'
                });

                // Ensure TypeScript worker is connected
                setTimeout(() => {
                    monaco.languages.typescript.getTypeScriptWorker().then(worker => {
                        return worker(modelUri).then(client => {
                            console.log('[TS-Function] TypeScript worker connected to model');
                            
                            // Force initial validation
                            client.getSyntacticDiagnostics(modelUri.toString()).then(diagnostics => {
                                console.log('[TS-Function] Initial syntax diagnostics:', diagnostics.length);
                            });
                            
                            client.getSemanticDiagnostics(modelUri.toString()).then(diagnostics => {
                                console.log('[TS-Function] Initial semantic diagnostics:', diagnostics.length);
                            });
                        });
                    }).catch(error => {
                        console.error('[TS-Function] TypeScript worker error:', error);
                    });
                }, 500);

                // Configure TypeScript-specific editor options
                editor.updateOptions({
                    quickSuggestions: {
                        other: true,
                        comments: false,
                        strings: false
                    },
                    parameterHints: { enabled: true },
                    suggestOnTriggerCharacters: true,
                    acceptSuggestionOnCommitCharacter: true,
                    snippetSuggestions: 'inline',
                    wordBasedSuggestions: false,
                    hover: { enabled: true },
                    semanticHighlighting: { enabled: true }
                });
                
                console.log('[TS-Function] TypeScript editor configured');
                return editor;
            };

            // Create the main function editor
            this.editor = buildEditor($("#node-input-func-editor")[0], this.func);
            
            // Load userDir types after editor is ready
            setTimeout(() => {
                if (RED.editor.types && RED.editor.types.typescript) {
                    console.log('[TS-Function] Loading userDir types...');
                    RED.editor.types.typescript.loadUserDirTypes().then(files => {
                        console.log(`[TS-Function] Loaded ${files.length} userDir TypeScript files`);
                    });
                }
            }, 1000);

            // Add compile/validate button
            var compileBtn = $('<button type="button" class="red-ui-button red-ui-button-small" style="float: right; margin: 5px;">Validate TypeScript</button>');
            $("#node-input-func-editor").before(compileBtn);
            
            compileBtn.click(function() {
                var code = that.editor.getModel().getValue();
                $.ajax({
                    url: "function/typescript/compile",
                    type: "POST",
                    data: JSON.stringify({ code: code }),
                    contentType: "application/json",
                    success: function(result) {
                        if (result.errors && result.errors.length > 0) {
                            RED.notify("TypeScript errors:\n" + result.errors.map(e => e.message).join('\n'), "error");
                        } else {
                            RED.notify("TypeScript validation successful!", "success");
                        }
                    },
                    error: function(xhr) {
                        RED.notify("TypeScript compilation failed: " + xhr.responseText, "error");
                    }
                });
            });

            // Setup tabs
            var tabs = RED.tabs.create({
                id: "typescript-func-tabs",
                onchange: function(tab) {
                    $("#typescript-func-tabs-content").children().hide();
                    $("#" + tab.id).show();
                }
            });
            
            tabs.addTab({
                id: "typescript-func-tab-body",
                label: "Function"
            });
            
            tabs.activateTab("typescript-func-tab-body");

            // Outputs configuration
            $("#node-input-outputs").spinner({
                min: 0,
                max: 16,
                change: function(event, ui) {
                    var value = this.value;
                    if (!value.match(/^\d+$/)) { value = 1; }
                    else if (value < this.min) { value = this.min; }
                    if (value !== this.value) { $(this).spinner("value", value); }
                }
            });
        },
        oneditsave: function() {
            var that = this;
            this.func = this.editor.getModel().getValue();
            
            // Compile TypeScript before saving
            console.log('[TS-Function] Compiling TypeScript on save...');
            
            // Synchronous compilation for now - could be made async
            $.ajax({
                url: "function/typescript/compile",
                type: "POST",
                data: JSON.stringify({ code: this.func }),
                contentType: "application/json",
                async: false, // Make synchronous to block saving if compilation fails
                success: function(result) {
                    if (result.errors && result.errors.length > 0) {
                        that.compilationErrors = result.errors;
                        that.compiledFunc = ""; // Clear compiled function if there are errors
                        console.warn('[TS-Function] TypeScript compilation had errors:', result.errors);
                        RED.notify("TypeScript compilation warnings:\n" + result.errors.map(e => e.message).join('\n'), "warning");
                    } else {
                        that.compilationErrors = [];
                        that.compiledFunc = result.outputText;
                        console.log('[TS-Function] TypeScript compilation successful, compiled code length:', result.outputText.length);
                    }
                },
                error: function(xhr) {
                    that.compilationErrors = [{ message: "Compilation failed: " + xhr.responseText }];
                    that.compiledFunc = "";
                    console.error('[TS-Function] TypeScript compilation failed:', xhr.responseText);
                    RED.notify("TypeScript compilation failed: " + xhr.responseText, "error");
                }
            });
            
            this.editor.dispose();
            delete this.editor;
        },
        oneditcancel: function() {
            this.editor.dispose();
            delete this.editor;
        },
        oneditresize: function(size) {
            var height = size.height;
            $("#node-input-func-editor").css("height", Math.max(height - 100, 500) + "px");
            if (this.editor) {
                this.editor.layout();
            }
        }
    });
</script>

<script type="text/html" data-template-name="typescript-function">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]common.label.name">

    <div class="form-row" style="height: 550px;">
        <div id="typescript-func-tabs" style="height: 100%;min-height: 500px;">
            <div id="typescript-func-tabs-content" style="height: calc(100% - 35px);">
                <div id="typescript-func-tab-body" class="typescript-func-tab-content" style="height:100%;">
                    <div id="node-input-func-editor" style="height:100%;"></div>

    </div>
</script>

<script type="text/html" data-help-name="typescript-function">
    <p>A dedicated TypeScript function node with full type checking and IntelliSense support.</p>
    <h3>Features</h3>
    <ul>
        <li>Full TypeScript syntax support with type checking</li>
        <li>IntelliSense and auto-completion</li>
        <li>Import from userDir using <code>@userDir/</code> prefix</li>
        <li>Real-time error highlighting with red squiggly lines</li>
        <li>Compile-time validation</li>
    </ul>
    <h3>Function Structure</h3>
    <p>TypeScript functions should export a default function that receives the message and returns the modified message:</p>
    <pre>export default function(msg: NodeMessage): NodeMessage {
    // Your logic here
    return msg;
}</pre>
    <h3>Advanced Example</h3>
    <pre>import { DataSchema, processData } from '@userDir/lib/helpers';

interface CustomMessage extends NodeMessage {
    temperature: number;
    humidity: number;
}

export default function(
    msg: NodeMessage,
    send: NodeSend,
    done: NodeDone,
    node: Node
): NodeMessage | null {
    const typedMsg = msg as CustomMessage;
    
    if (typeof typedMsg.temperature === 'number') {
        const processed = processData(typedMsg);
        msg.payload = {
            ...processed,
            status: 'processed'
        };
        return msg;
    } else {
        node.error('Invalid temperature data');
        return null; // Don't send anything
    }
}</pre>
</script> 
</script>
