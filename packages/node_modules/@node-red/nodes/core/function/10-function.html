<script type="text/x-red" data-template-name="function">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]common.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-language"><i class="fa fa-code"></i> <span data-i18n="function.label.language"></span></label>
        <select id="node-input-language" style="width:70%;">
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
        </select>
    </div>
    <div class="form-row" style="margin-bottom: 0px;">
        <label for="node-input-func"><i class="fa fa-wrench"></i> <span data-i18n="function.label.function"></span></label>
        <input type="hidden" id="node-input-func" autofocus="autofocus">
        <input type="hidden" id="node-input-noerr">
    </div>
    <div class="form-row node-text-editor-row">
        <div style="height: 250px; min-height:150px;" class="node-text-editor" id="node-input-func-editor" ></div>
    </div>
    <div class="form-row">
        <label for="node-input-outputs"><i class="fa fa-random"></i> <span data-i18n="function.label.outputs"></span></label>
        <input id="node-input-outputs" style="width: 60px;" value="1">
    </div>
    <div class="form-tips">
        <p><span data-i18n="function.tip.js"></span></p>
        <p id="typescript-tip" style="display:none;"><span data-i18n="function.tip.ts"></span></p>
    </div>
</script>

<script type="text/x-red" data-help-name="function">
    <p>A function block where you can write code to do more interesting things.</p>
    <p>The message is passed in as a JavaScript object called <code>msg</code>.</p>
    <p>By convention it will have a <code>msg.payload</code> property containing
       the body of the message.</p>
    <p>The function is expected to return a message object (or multiple message objects), but can choose
       to return nothing in order to halt a flow.</p>
    <p>The <strong>Setup</strong> tab contains code that will be run whenever the node is started.</p>
    <p>The <strong>Close</strong> tab contains code that will be run when the node is stopped.</p>
    <p><b>TypeScript Support:</b></p>
    <p>When TypeScript mode is enabled, you can use TypeScript syntax including:</p>
    <ul>
        <li>Type annotations and interfaces</li>
        <li>Import statements for Zod schemas</li>
        <li>Modern ES6+ features</li>
        <li>Full IntelliSense support</li>
    </ul>
    <p><b>Available Libraries:</b></p>
    <ul>
        <li><code>z</code> or <code>zod</code> - Schema validation library</li>
        <li><code>@node-red/scripts/*</code> - Custom reusable scripts</li>
    </ul>
    <h3>Example TypeScript Function:</h3>
    <pre>
import { z } from 'zod';

const UserSchema = z.object({
    name: z.string(),
    age: z.number().min(0),
    email: z.string().email()
});

// Validate and transform the message
try {
    const user = UserSchema.parse(msg.payload);
    msg.payload = {
        ...user,
        processed: true,
        timestamp: new Date().toISOString()
    };
    return msg;
} catch (error) {
    node.error("Validation failed: " + error.message, msg);
    return null;
}
    </pre>
</script>

<script type="text/javascript">
    RED.nodes.registerType('function',{
        category: 'function',
        color:"#fdd0a2",
        defaults: {
            name: {value:""},
            language: {value:"javascript"},
            func: {value:"return msg;"},
            outputs: {value:1},
            noerr: {value:0,required:true,validate:function(v) { return ((!v) || (v === 0)) ? true : false; }}
        },
        inputs:1,
        outputs:1,
        icon: "function.svg",
        label: function() {
            return this.name || this._("function.function");
        },
        labelStyle: function() {
            return this.name?"node_label_italic":"";
        },
        oneditprepare: function() {
            var that = this;
            $( "#node-input-outputs" ).spinner({
                min:1
            });

            this.editor = RED.editor.createEditor({
                id: 'node-input-func-editor',
                mode: this.language === 'typescript' ? 'ace/mode/typescript' : 'ace/mode/javascript',
                value: $("#node-input-func").val(),
                globals: {
                    msg:true,
                    context:true,
                    RED: true,
                    util: true,
                    flow: true,
                    global: true,
                    console: true,
                    Buffer: true,
                    setTimeout: true,
                    clearTimeout: true,
                    setInterval: true,
                    clearInterval: true,
                    z: true,
                    zod: true
                }
            });

            // Handle language change
            $("#node-input-language").change(function() {
                var lang = $(this).val();
                that.language = lang;
                
                // Switch editor mode
                if (lang === 'typescript') {
                    that.editor.getSession().setMode('ace/mode/typescript');
                    $("#typescript-tip").show();
                    $(".form-tips p:first").hide();
                } else {
                    that.editor.getSession().setMode('ace/mode/javascript');
                    $("#typescript-tip").hide();
                    $(".form-tips p:first").show();
                }
                
                // Enable TypeScript features if Monaco is available
                if (lang === 'typescript' && window.monaco) {
                    that.setupMonacoTypeScript();
                }
            });

            // Set initial language
            $("#node-input-language").val(this.language || 'javascript').trigger('change');

            RED.library.create({
                url:"functions", // where to get the data from
                type:"function", // the type of object the library is for
                editor:this.editor, // the field name the main text body goes to
                mode:"ace/mode/javascript",
                fields:['name','outputs']
            });
            this.editor.focus();
        },
        setupMonacoTypeScript: function() {
            // This would be called when TypeScript mode is enabled
            // and Monaco editor is available for enhanced IntelliSense
            if (!window.monaco) return;

            // Add Node-RED type definitions
            var nodeRedTypes = `
declare interface NodeRedMessage {
    payload: any;
    topic?: string;
    _msgid?: string;
    [key: string]: any;
}

declare interface NodeRedNode {
    id: string;
    name: string;
    send(msg: NodeRedMessage | NodeRedMessage[]): void;
    error(error: string | Error, msg?: NodeRedMessage): void;
    warn(warning: string): void;
    log(message: string): void;
    status(options: {fill?: string, shape?: string, text?: string}): void;
    done(): void;
}

declare var msg: NodeRedMessage;
declare var node: NodeRedNode;
declare var context: any;
declare var flow: any;
declare var global: any;

// Zod types
declare module 'zod' {
    export * from 'zod';
}

declare var z: typeof import('zod');
declare var zod: typeof import('zod');
`;

            window.monaco.languages.typescript.typescriptDefaults.addExtraLib(
                nodeRedTypes,
                'file:///node_modules/@types/node-red/index.d.ts'
            );

            // Configure TypeScript compiler options
            window.monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
                target: window.monaco.languages.typescript.ScriptTarget.ES2020,
                module: window.monaco.languages.typescript.ModuleKind.CommonJS,
                moduleResolution: window.monaco.languages.typescript.ModuleResolutionKind.NodeJs,
                allowNonTsExtensions: true,
                strict: false,
                esModuleInterop: true,
                skipLibCheck: true
            });
        },
        oneditsave: function() {
            $("#node-input-func").val(this.editor.getValue());
            this.editor.destroy();
            delete this.editor;
        },
        oneditcancel: function() {
            this.editor.destroy();
            delete this.editor;
        },
        oneditresize: function(size) {
            var rows = $("#dialog-form>div:not(.node-text-editor-row)");
            var height = $("#dialog-form").height();
            for (var i=0; i<rows.size(); i++) {
                height -= $(rows[i]).outerHeight(true);
            }
            var editorRow = $("#dialog-form>div.node-text-editor-row");
            height -= (parseInt(editorRow.css("marginTop"))+parseInt(editorRow.css("marginBottom")));
            $(".node-text-editor").css("height",height+"px");
            this.editor.resize();
        }
    });
</script>
