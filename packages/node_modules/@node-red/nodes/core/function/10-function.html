<script type="text/javascript">
    // Embedded TypeScript support for function nodes
    (function() {
        // Ensure RED.editor.types namespace exists
        if (!RED.editor.types) {
            RED.editor.types = {};
        }
        
        // Only initialize if not already present
        if (!RED.editor.types.typescript) {
            console.log('[Function] Initializing embedded TypeScript support...');
            
            RED.editor.types.typescript = (function() {
                // Track loaded type definitions
                const loadedTypes = new Set();
                
                /**
                 * Initialize TypeScript support for Monaco editor
                 */
                function init() {
                    console.log('[TS] Initializing TypeScript support...');
                    
                    if (!window.monaco) {
                        console.warn("[TS] Monaco editor not loaded, TypeScript support unavailable");
                        return;
                    }
                    
                    console.log('[TS] Monaco editor found, configuring TypeScript...');
                    
                    // Simple TypeScript configuration - avoid conflicts
                    monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
                        target: monaco.languages.typescript.ScriptTarget.ES2020,
                        allowNonTsExtensions: true,
                        moduleResolution: monaco.languages.typescript.ModuleResolutionKind.NodeJs,
                        module: monaco.languages.typescript.ModuleKind.CommonJS,
                        noEmit: true,
                        esModuleInterop: true,
                        allowSyntheticDefaultImports: true,
                        allowJs: true,
                        typeRoots: ["node_modules/@types"]
                    });
                    
                    // Enable diagnostics for error highlighting
                    monaco.languages.typescript.typescriptDefaults.setDiagnosticsOptions({
                        noSemanticValidation: false,
                        noSyntaxValidation: false,
                        noSuggestionDiagnostics: false,
                        diagnosticCodesToIgnore: [
                            2307 // Cannot find module - ignore for @userDir imports
                        ]
                    });
                    
                    console.log('[TS] TypeScript compiler options configured');
                    
                    // Add basic Node-RED type definitions
                    addNodeRedTypes();
                    
                    console.log('[TS] TypeScript support initialization complete');
                }
                
                /**
                 * Add Node-RED specific type definitions
                 */
                function addNodeRedTypes() {
                    console.log('[TS] Adding Node-RED type definitions...');
                    
                    const nodeRedTypes = `
                    declare global {
                        interface NodeMessage {
                            payload: any;
                            topic?: string;
                            _msgid?: string;
                            [key: string]: any;
                        }

                        interface NodeSend {
                            (msg: NodeMessage | NodeMessage[] | NodeMessage[][]): void;
                        }

                        interface NodeDone {
                            (error?: Error): void;
                        }

                        interface NodeContext {
                            get(key: string): any;
                            set(key: string, value: any): void;
                            keys(): string[];
                            global: {
                                get(key: string): any;
                                set(key: string, value: any): void;
                                keys(): string[];
                            };
                            flow: {
                                get(key: string): any;
                                set(key: string, value: any): void;
                                keys(): string[];
                            };
                        }

                        interface NodeEnvironment {
                            get(key: string): string | undefined;
                        }

                        interface Node {
                            id: string;
                            name: string;
                            outputCount: number;
                            log(...args: any[]): void;
                            warn(...args: any[]): void;
                            error(...args: any[]): void;
                            debug(...args: any[]): void;
                            trace(...args: any[]): void;
                            status(status: {fill?: string, shape?: string, text?: string}): void;
                            send: NodeSend;
                            done: NodeDone;
                        }

                        const msg: NodeMessage;
                        const send: NodeSend;
                        const done: NodeDone;
                        const node: Node;
                        const context: NodeContext;
                        const flow: NodeContext['flow'];
                        const global: NodeContext['global'];
                        const env: NodeEnvironment;
                        
                        function requireUserDir(module: string): any;
                    }
                    export {};
                    `;
                    
                    try {
                        monaco.languages.typescript.typescriptDefaults.addExtraLib(
                            nodeRedTypes,
                            'file:///node-red-types.d.ts'
                        );
                        loadedTypes.add('node-red-types');
                        console.log('[TS] Node-RED type definitions added');
                    } catch (error) {
                        console.error('[TS] Failed to add Node-RED types:', error);
                    }
                }
                
                /**
                 * Load types from userDir - simplified version
                 */
                async function loadUserDirTypes() {
                    console.log('[TS] Loading userDir types...');
                    
                    try {
                        // Get list of TypeScript files from userDir
                        const listResponse = await fetch('function/typescript/userdir-list');
                        
                        if (!listResponse.ok) {
                            console.error(`[TS] Failed to fetch userDir file list: ${listResponse.status}`);
                            return [];
                        }
                        
                        const { files } = await listResponse.json();
                        console.log(`[TS] Found ${files.length} TypeScript files in userDir`);
                        
                        // Load each file and add as type definition
                        for (const file of files) {
                            try {
                                console.log(`[TS] Loading userDir file: ${file.path}`);
                                const response = await fetch(`function/typescript/userdir/${file.fullPath}`);
                                
                                if (response.ok) {
                                    const content = await response.text();
                                    
                                    // Add as module declaration to avoid import resolution issues
                                    const moduleDeclaration = `
declare module "@userDir/${file.fullPath.replace(/\.(ts|tsx)$/, '')}" {
${content.replace(/^export /gm, '    export ')}
}
                                    `;
                                    
                                    const libPath = `file:///userDir-${file.path.replace(/[\/\\]/g, '-')}.d.ts`;
                                    
                                    monaco.languages.typescript.typescriptDefaults.addExtraLib(
                                        moduleDeclaration,
                                        libPath
                                    );
                                    
                                    console.log(`[TS] Added userDir module: @userDir/${file.fullPath.replace(/\.(ts|tsx)$/, '')}`);
                                }
                            } catch (err) {
                                console.error(`[TS] Error loading ${file.path}:`, err);
                            }
                        }
                        
                        return files;
                    } catch (error) {
                        console.error('[TS] Error loading userDir types:', error);
                        return [];
                    }
                }
                
                /**
                 * Setup auto-import detection - simplified
                 */
                function setupAutoImport(editor) {
                    console.log('[TS] Setting up auto-import detection...');
                    // For now, just load userDir types once
                    loadUserDirTypes();
                }
                
                // Initialize when Monaco is ready
                if (window.monaco) {
                    console.log('[TS] Monaco already loaded, initializing immediately');
                    init();
                } else {
                    console.log('[TS] Waiting for Monaco to load...');
                    const checkMonaco = setInterval(() => {
                        if (window.monaco) {
                            clearInterval(checkMonaco);
                            console.log('[TS] Monaco loaded, initializing TypeScript support');
                            init();
                        }
                    }, 100);
                }
                
                return {
                    init: init,
                    loadUserDirTypes: loadUserDirTypes,
                    setupAutoImport: setupAutoImport
                };
            })();
        }
    })();
</script>

<script type="text/javascript">
    (function() {
        // TypeScript support configuration
        var tsSupport = {
            monacoLoaded: false,
            compilerInitialized: false,
            typeAcquisition: null
        };

        // Initialize TypeScript support when Monaco loads
        function initTypeScriptSupport() {
            if (!tsSupport.monacoLoaded || !window.monaco) return;

            // Configure TypeScript compiler options
            monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
                target: monaco.languages.typescript.ScriptTarget.ES2020,
                module: monaco.languages.typescript.ModuleKind.CommonJS,
                moduleResolution: monaco.languages.typescript.ModuleResolutionKind.NodeJs,
                esModuleInterop: true,
                allowSyntheticDefaultImports: true,
                resolveJsonModule: true,
                noImplicitAny: true,
                strict: true,
                baseUrl: '.',
                paths: {
                    "@userDir/*": ["*"],
                    "@lib/*": ["lib/*"],
                    "@nodes/*": ["nodes/*"]
                }
            });

            // Add Node-RED type definitions
            const nodeRedTypes = `
                declare global {
                    interface NodeMessage {
                        payload: any;
                        topic?: string;
                        _msgid?: string;
                        [key: string]: any;
                    }

                    interface NodeSend {
                        (msg: NodeMessage | NodeMessage[] | NodeMessage[][]): void;
                    }

                    interface NodeDone {
                        (error?: Error): void;
                    }

                    interface NodeContext {
                        get(key: string): any;
                        set(key: string, value: any): void;
                        keys(): string[];
                        global: {
                            get(key: string): any;
                            set(key: string, value: any): void;
                            keys(): string[];
                        };
                        flow: {
                            get(key: string): any;
                            set(key: string, value: any): void;
                            keys(): string[];
                        };
                    }

                    interface NodeEnvironment {
                        get(key: string): string | undefined;
                    }

                    interface Node {
                        id: string;
                        name: string;
                        outputCount: number;
                        log(...args: any[]): void;
                        warn(...args: any[]): void;
                        error(...args: any[]): void;
                        debug(...args: any[]): void;
                        trace(...args: any[]): void;
                        status(status: {fill?: string, shape?: string, text?: string}): void;
                        send: NodeSend;
                        done: NodeDone;
                    }

                    const msg: NodeMessage;
                    const send: NodeSend;
                    const done: NodeDone;
                    const node: Node;
                    const context: NodeContext;
                    const flow: NodeContext['flow'];
                    const global: NodeContext['global'];
                    const env: NodeEnvironment;
                    
                    function requireUserDir(module: string): any;
                }
                export {};
            `;
            
            monaco.languages.typescript.typescriptDefaults.addExtraLib(
                nodeRedTypes,
                'node-red-types.d.ts'
            );

            // Set up automatic type acquisition
            if (typeof window.MonacoEditorAutoTypings !== 'undefined') {
                tsSupport.typeAcquisition = new window.MonacoEditorAutoTypings({
                    monaco: monaco,
                    debounceTime: 2000,
                    preloadPackages: ['node', 'zod'],
                    onUpdateTypings: function(typings) {
                        console.log('TypeScript types updated:', Object.keys(typings));
                    }
                });
            }

            tsSupport.compilerInitialized = true;
        }

        // Function node definition
        RED.nodes.registerType('function',{
            color:"#fdd0a2",
            category: 'function',
            defaults: {
                name: {value:""},
                func: {value:"\nreturn msg;"},
                outputs: {value:1},
                noerr: {value:0,required:true,validate:function(v) { return !v; }},
                initialize: {value:""},
                finalize: {value:""},
                libs: {value:[]},
                isTypeScript: {value:false},
                userDirImports: {value:[]}
            },
            inputs:1,
            outputs:1,
            icon: "function.svg",
            label: function() {
                return this.name || (this.isTypeScript ? "TS function" : "function");
            },
            labelStyle: function() {
                return this.name?"node_label_italic":"";
            },
            oneditprepare: function() {
                var that = this;
                
                console.log('[Function] oneditprepare called for node:', this.id);
                
                // Language toggle
                $("#node-input-language").on("change", function() {
                    var lang = $(this).val();
                    that.isTypeScript = (lang === "typescript");
                    
                    console.log('[Function] Language changed to:', lang);
                    
                    if (that.editor) {
                        var model = that.editor.getModel();
                        if (model) {
                            monaco.editor.setModelLanguage(model, lang);
                        }
                        
                        // Update editor options based on language
                        if (that.isTypeScript) {
                            that.editor.updateOptions({
                                quickSuggestions: true,
                                parameterHints: { enabled: true },
                                suggestOnTriggerCharacters: true,
                                acceptSuggestionOnCommitCharacter: true,
                                snippetSuggestions: 'inline',
                                wordBasedSuggestions: false
                            });
                        }
                    }
                });

                // Initialize Monaco editor
                var buildEditor = function(element, lang, value) {
                    var editor = RED.editor.createEditor({
                        element: element,
                        mode: lang === 'typescript' ? 'typescript' : 'javascript',
                        value: value,
                        minimap: { enabled: false },
                        fontSize: 14,
                        scrollBeyondLastLine: false,
                        automaticLayout: true,
                        language: lang
                    });

                    // Enable TypeScript features if TypeScript mode
                    if (lang === 'typescript') {
                        console.log('[Function] Configuring TypeScript editor features...');
                        
                        // Simple TypeScript editor configuration
                        editor.updateOptions({
                            quickSuggestions: true,
                            parameterHints: { enabled: true },
                            suggestOnTriggerCharacters: true,
                            wordBasedSuggestions: false
                        });
                        
                        console.log('[Function] TypeScript editor configured');
                    }

                    return editor;
                };

                
                this.editor = buildEditor($("#node-input-func-editor")[0], 
                this.isTypeScript ? 'typescript' : 'javascript', 
                this.func);
                
                // Load userDir types for TypeScript
                if (this.isTypeScript) {
                    console.log('[Function] Loading userDir types for TypeScript...');
                    
                    // Wait for TypeScript support to be available and load types once
                    var loadUserDirTypes = function() {
                        if (RED.editor.types && RED.editor.types.typescript) {
                            console.log('[Function] TypeScript support available, loading userDir types...');
                            
                            // Load userDir TypeScript files once
                            RED.editor.types.typescript.loadUserDirTypes().then(files => {
                                console.log(`[Function] Loaded ${files.length} userDir TypeScript files`);
                            }).catch(error => {
                                console.error('[Function] Failed to load userDir types:', error);
                            });
                            
                            // Enable auto-import detection
                            console.log('[Function] Setting up auto-import detection...');
                            RED.editor.types.typescript.setupAutoImport(that.editor);
                        } else {
                            console.log('[Function] TypeScript support not yet available, retrying...');
                            setTimeout(loadUserDirTypes, 100);
                        }
                    };
                    
                    // Load types after a brief delay to ensure editor is ready
                    setTimeout(loadUserDirTypes, 1000);
                }

                
                // Add compile button for TypeScript
                if (this.isTypeScript) {
                    var compileBtn = $('<button type="button" class="red-ui-button red-ui-button-small" style="float: right; margin: 5px;">Validate TypeScript</button>');
                    $("#node-input-func-editor").before(compileBtn);
                    
                    compileBtn.click(function() {
                        var code = that.editor.getValue();
                        $.ajax({
                            url: "function/typescript/compile",
                            type: "POST",
                            data: JSON.stringify({
                                code: code,
                                compilerOptions: {
                                    target: "ES2020",
                                    module: "commonjs",
                                    moduleResolution: "node"
                                }
                            }),
                            contentType: "application/json",
                            success: function(result) {
                                if (result.errors && result.errors.length > 0) {
                                    RED.notify("TypeScript errors:\n" + result.errors.map(e => e.message).join('\n'), "error");
                                } else {
                                    RED.notify("TypeScript validation successful!", "success");
                                }
                            },
                            error: function(xhr) {
                                RED.notify("TypeScript compilation failed: " + xhr.responseText, "error");
                            }
                        });
                    });
                }

                // Setup, teardown, and error handling tabs
                var tabs = RED.tabs.create({
                    id: "func-tabs",
                    onchange: function(tab) {
                        $("#func-tabs-content").children().hide();
                        $("#" + tab.id).show();
                    }
                });
                
                tabs.addTab({
                    id: "func-tab-init",
                    label: that._("function.label.initialize")
                });
                
                tabs.addTab({
                    id: "func-tab-body",
                    label: that._("function.label.function")
                });
                
                tabs.addTab({
                    id: "func-tab-finalize",
                    label: that._("function.label.finalize")
                });
                
                tabs.activateTab("func-tab-body");

                // Outputs configuration
                $("#node-input-outputs").spinner({
                    min:0,
                    max:16,
                    change: function(event, ui) {
                        var value = this.value;
                        if (!value.match(/^\d+$/)) { value = 1; }
                        else if (value < this.min) { value = this.min; }
                        if (value !== this.value) { $(this).spinner("value", value); }
                    }
                });
            },
            oneditsave: function() {
                var node = this;
                node.func = this.editor.getValue();
                node.isTypeScript = $("#node-input-language").val() === "typescript";
                
                // Save initialize and finalize functions if they exist
                if (this.initEditor) {
                    node.initialize = this.initEditor.getValue();
                }
                if (this.finalizeEditor) {
                    node.finalize = this.finalizeEditor.getValue();
                }
                
                this.editor.destroy();
                delete this.editor;
            },
            oneditcancel: function() {
                this.editor.destroy();
                delete this.editor;
            },
            oneditresize: function(size) {
                var height = size.height;
                $("#node-input-func-editor").css("height", Math.max(height-120, 400)+"px");
                if (this.editor) {
                    this.editor.layout();
                }
            }
        });
    })();
</script>

<script type="text/html" data-help-name="function">
    <p>A function block where you can write code to do more interesting things.</p>
    <h3>Inputs</h3>
    <p>The function receives a message object called <code>msg</code> containing the data from the previous node.</p>
    <h3>Outputs</h3>
    <p>The function should return the messages it wants to pass on to the next nodes.</p>
    <h3>TypeScript Support</h3>
    <p>This node now supports TypeScript! Select "TypeScript" from the language dropdown to enable:</p>
    <ul>
        <li>Full TypeScript syntax support with type checking</li>
        <li>IntelliSense and auto-completion</li>
        <li>Import from userDir using <code>@userDir/</code> prefix</li>
        <li>Automatic type definitions for Node.js and npm packages</li>
        <li>Compile-time validation on deploy</li>
    </ul>
    <h4>Example TypeScript Usage:</h4>
    <pre>import { z } from 'zod';
import { myFunction } from '@userDir/lib/helpers';

interface CustomMessage extends NodeMessage {
    temperature: number;
    humidity: number;
}

const SensorSchema = z.object({
    temperature: z.number().min(-50).max(100),
    humidity: z.number().min(0).max(100)
});

const msg = msg as CustomMessage;

try {
    const validated = SensorSchema.parse(msg.payload);
    msg.payload = myFunction(validated);
    node.status({fill:"green", shape:"dot", text:"processed"});
} catch (error) {
    node.error("Validation failed", msg);
    node.status({fill:"red", shape:"ring", text:"error"});
}

return msg;</pre>
</script>
