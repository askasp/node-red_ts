<script type="text/javascript">
    // Reuse TypeScript support from typescript-function node
    (function() {
        // Ensure RED.editor.types namespace exists
        if (!RED.editor.types) {
            RED.editor.types = {};
        }
        
        // Initialize TypeScript support (reuse from typescript-function)
        if (!RED.editor.types.typescript) {
            console.log('[TS-File] Initializing TypeScript support...');
            
            RED.editor.types.typescript = (function() {
                const loadedTypes = new Set();
                
                function init() {
                    if (!window.monaco) {
                        console.warn("[TS] Monaco editor not loaded");
                        return;
                    }
                    
                    console.log('[TS] Configuring TypeScript for file writer...');
                    
                    // Configure TypeScript with strict type checking
                    monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
                        target: monaco.languages.typescript.ScriptTarget.ES2020,
                        module: monaco.languages.typescript.ModuleKind.CommonJS,
                        moduleResolution: monaco.languages.typescript.ModuleResolutionKind.NodeJs,
                        esModuleInterop: true,
                        allowSyntheticDefaultImports: true,
                        strict: true,
                        noImplicitAny: true,
                        strictNullChecks: true,
                        strictPropertyInitialization: false,
                        allowJs: false // Pure TypeScript only
                    });
                    
                    // Enable strict diagnostics
                    monaco.languages.typescript.typescriptDefaults.setDiagnosticsOptions({
                        noSemanticValidation: false,
                        noSyntaxValidation: false,
                        noSuggestionDiagnostics: false,
                        diagnosticCodesToIgnore: []
                    });
                    
                    addNodeRedTypes();
                    loadUserDirTypes();
                }
                
                function addNodeRedTypes() {
                    console.log('[TS-File] Adding TypeScript definitions...');
                    const nodeRedTypes = `
declare global {
    interface NodeMessage {
        payload: any;
        topic?: string;
        _msgid?: string;
        [key: string]: any;
    }

    interface MongoDBChangeEvent {
        collection: string;
        change: "insert" | "update" | "delete" | "replace";
        before: any | null;
        after: any | null;
        changedAt: string;
        metadata?: {
            documentKey?: any;
            updateDescription?: {
                updatedFields?: any;
                removedFields?: string[];
            };
            ns?: {
                db: string;
                coll: string;
            };
        };
    }
}

// Generic module declaration for userDir imports
declare module "@userDir/*" {
    const content: any;
    export default content;
    export * from content;
}

export {};
                    `;
                    
                    // Clear any existing lib to force refresh
                    try {
                        monaco.languages.typescript.typescriptDefaults.setExtraLibs([]);
                    } catch (e) { /* ignore */ }
                    
                    monaco.languages.typescript.typescriptDefaults.addExtraLib(
                        nodeRedTypes,
                        'file:///node-red-types.d.ts'
                    );
                    loadedTypes.add('node-red-types');
                }
                
                async function loadUserDirTypes() {
                    try {
                        const listResponse = await fetch('function/typescript/userdir-list');
                        if (!listResponse.ok) return [];
                        
                        const { files } = await listResponse.json();
                        console.log(`[TS] Found ${files.length} TypeScript files in userDir`);
                        
                        for (const file of files) {
                            try {
                                console.log(`[TS] Loading TypeScript file: ${file.path} -> @userDir/${file.fullPath.replace(/\.(ts|tsx)$/, '')}`);
                                const response = await fetch(`function/typescript/userdir/${file.fullPath}`);
                                if (response.ok) {
                                    const content = await response.text();
                                    
                                    // Create clean module path 
                                    const modulePath = file.fullPath.replace(/\.(ts|tsx)$/, '');
                                    
                                    // Add as module declaration
                                    const moduleDeclaration = `
declare module "@userDir/${modulePath}" {
${content.replace(/^export /gm, '    export ')}
}`;
                                    
                                    // Add to Monaco's type system
                                    monaco.languages.typescript.typescriptDefaults.addExtraLib(
                                        moduleDeclaration,
                                        `file:///userDir-${file.path.replace(/[\/\\]/g, '-')}.d.ts`
                                    );
                                    
                                    // Also add the raw content for better intellisense
                                    monaco.languages.typescript.typescriptDefaults.addExtraLib(
                                        content,
                                        `file:///@userDir/${modulePath}.ts`
                                    );
                                    
                                    console.log(`[TS] ✅ Added module: @userDir/${modulePath}`);
                                } else {
                                    console.warn(`[TS] Failed to load ${file.path}: ${response.status}`);
                                }
                            } catch (err) {
                                console.error(`[TS] Error loading ${file.path}:`, err);
                            }
                        }
                        return files;
                    } catch (error) {
                        console.error('[TS] Error loading userDir types:', error);
                        return [];
                    }
                }
                
                // Initialize when Monaco is ready
                if (window.monaco) {
                    init();
                } else {
                    const checkMonaco = setInterval(() => {
                        if (window.monaco) {
                            clearInterval(checkMonaco);
                            init();
                        }
                    }, 100);
                }
                
                return { init, loadUserDirTypes };
            })();
        }
    })();
</script>

<script type="text/javascript">
    RED.nodes.registerType('typescript-file', {
        color: "#98FB98",
        category: 'function',
        defaults: {
            name: {value: ""},
            filePath: {value: "lib/schemas.ts"},
            content: {value: "// TypeScript schema definitions\n// This file will be saved to userDir and can be imported using @userDir/\n\nexport interface User {\n    id: string;\n    name: string;\n    email: string;\n    age?: number;\n}\n\nexport interface CreateUser {\n    name: string;\n    email: string;\n    age?: number;\n}\n\nexport interface UserView extends User {\n    createdAt: Date;\n    updatedAt: Date;\n}\n\n// Example enum\nexport enum UserRole {\n    ADMIN = 'admin',\n    USER = 'user',\n    MODERATOR = 'moderator'\n}\n\n// Example type union\nexport type UserStatus = 'active' | 'inactive' | 'suspended';\n\n// Example generic type\nexport interface ApiResponse<T> {\n    success: boolean;\n    data: T;\n    message?: string;\n}\n"}
        },
        inputs: 0,
        outputs: 0,
        icon: "file-text.svg",
        label: function() {
            return this.name || `TS File: ${this.filePath}`;
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function() {
            var that = this;
            console.log('[TS-File] oneditprepare called');
            
            // Add popular package types to the editor
            var addPopularTypesToEditor = function() {
                console.log('[TS-File] Adding Zod types to Monaco editor...');
                
                // Add comprehensive Zod types directly to this Monaco instance
                const zodTypes = `
declare module "zod" {
    export interface ZodType<Output = any, Def extends ZodTypeDef = ZodTypeDef, Input = Output> {
        readonly _type: Output;
        readonly _output: Output;
        readonly _input: Input;
        readonly _def: Def;
        parse(input: unknown): Output;
        safeParse(input: unknown): ZodSafeParseSuccess<Output> | ZodSafeParseError;
        parseAsync(input: unknown): Promise<Output>;
        safeParseAsync(input: unknown): Promise<ZodSafeParseSuccess<Output> | ZodSafeParseError>;
        refine<RefinedOutput extends Output>(
            check: (arg: Output) => arg is RefinedOutput,
            message?: string | ZodCustomIssue | ((arg: Output) => ZodCustomIssue)
        ): ZodEffects<this, RefinedOutput, Input>;
        refine(
            check: (arg: Output) => unknown | Promise<unknown>,
            message?: string | ZodCustomIssue | ((arg: Output) => ZodCustomIssue)
        ): ZodEffects<this, Output, Input>;
        optional(): ZodOptional<this>;
        nullable(): ZodNullable<this>;
        nullish(): ZodNullish<this>;
        array(): ZodArray<this>;
        or<T extends ZodTypeAny>(option: T): ZodUnion<[this, T]>;
        and<T extends ZodTypeAny>(incoming: T): ZodIntersection<this, T>;
    }

    export interface ZodTypeDef {
        typeName: ZodFirstPartyTypeKind;
        description?: string;
    }

    export type ZodTypeAny = ZodType<any, any, any>;

    export interface ZodSafeParseSuccess<Output> {
        success: true;
        data: Output;
    }

    export interface ZodSafeParseError {
        success: false;
        error: ZodError;
    }

    export interface ZodError<T = any> extends Error {
        issues: ZodIssue[];
        format(): ZodFormattedError<T>;
        flatten(): ZodFlattenedError<T>;
    }

    export interface ZodIssue {
        code: string;
        path: (string | number)[];
        message: string;
    }

    export interface ZodCustomIssue extends Omit<ZodIssue, "code"> {
        code: "custom";
    }

    export interface ZodFormattedError<T> {
        _errors: string[];
    }

    export interface ZodFlattenedError<T> {
        formErrors: string[];
        fieldErrors: { [k: string]: string[] };
    }

    export enum ZodFirstPartyTypeKind {
        ZodString = "ZodString",
        ZodNumber = "ZodNumber",
        ZodBoolean = "ZodBoolean",
        ZodDate = "ZodDate",
        ZodObject = "ZodObject",
        ZodArray = "ZodArray",
        ZodUnion = "ZodUnion",
        ZodOptional = "ZodOptional",
        ZodNullable = "ZodNullable",
        ZodEffects = "ZodEffects"
    }

    // String
    export interface ZodString extends ZodType<string, ZodStringDef> {
        min(minLength: number, message?: string): ZodString;
        max(maxLength: number, message?: string): ZodString;
        length(len: number, message?: string): ZodString;
        email(message?: string): ZodString;
        url(message?: string): ZodString;
        uuid(message?: string): ZodString;
        regex(regex: RegExp, message?: string): ZodString;
        startsWith(value: string, message?: string): ZodString;
        endsWith(value: string, message?: string): ZodString;
        trim(): ZodString;
        toLowerCase(): ZodString;
        toUpperCase(): ZodString;
    }
    export interface ZodStringDef extends ZodTypeDef {
        typeName: ZodFirstPartyTypeKind.ZodString;
    }

    // Number
    export interface ZodNumber extends ZodType<number, ZodNumberDef> {
        min(min: number, message?: string): ZodNumber;
        max(max: number, message?: string): ZodNumber;
        int(message?: string): ZodNumber;
        positive(message?: string): ZodNumber;
        nonnegative(message?: string): ZodNumber;
        negative(message?: string): ZodNumber;
        nonpositive(message?: string): ZodNumber;
        multipleOf(value: number, message?: string): ZodNumber;
        finite(message?: string): ZodNumber;
        safe(message?: string): ZodNumber;
    }
    export interface ZodNumberDef extends ZodTypeDef {
        typeName: ZodFirstPartyTypeKind.ZodNumber;
    }

    // Boolean
    export interface ZodBoolean extends ZodType<boolean, ZodBooleanDef> {}
    export interface ZodBooleanDef extends ZodTypeDef {
        typeName: ZodFirstPartyTypeKind.ZodBoolean;
    }

    // Date
    export interface ZodDate extends ZodType<Date, ZodDateDef> {
        min(minDate: Date, message?: string): ZodDate;
        max(maxDate: Date, message?: string): ZodDate;
    }
    export interface ZodDateDef extends ZodTypeDef {
        typeName: ZodFirstPartyTypeKind.ZodDate;
    }

    // Object
    export interface ZodObject<T extends ZodRawShape> extends ZodType<ZodObjectType<T>, ZodObjectDef<T>, ZodObjectInput<T>> {
        shape: T;
        pick<Mask extends Partial<Record<keyof T, true>>>(mask: Mask): ZodObject<Pick<T, Extract<keyof T, keyof Mask>>>;
        omit<Mask extends Partial<Record<keyof T, true>>>(mask: Mask): ZodObject<Omit<T, keyof Mask>>;
        extend<Augmentation extends ZodRawShape>(augmentation: Augmentation): ZodObject<T & Augmentation>;
        merge<Incoming extends AnyZodObject>(merging: Incoming): ZodObject<T & Incoming["shape"]>;
        setKey<Key extends string, Schema extends ZodTypeAny>(key: Key, schema: Schema): ZodObject<T & { [k in Key]: Schema }>;
        strict(): ZodObject<T>;
        strip(): ZodObject<T>;
        passthrough(): ZodObject<T>;
        partial(): ZodObject<{ [k in keyof T]: ZodOptional<T[k]> }>;
        deepPartial(): ZodObject<{ [k in keyof T]: ZodOptional<T[k]> }>;
        required(): ZodObject<{ [k in keyof T]: T[k] extends ZodOptional<ZodTypeAny> ? T[k]["_def"]["innerType"] : T[k] }>;
    }

    export type ZodRawShape = { [k: string]: ZodTypeAny };
    export type ZodObjectType<T extends ZodRawShape> = { [k in keyof T]: T[k]["_output"] };
    export type ZodObjectInput<T extends ZodRawShape> = { [k in keyof T]: T[k]["_input"] };

    export interface ZodObjectDef<T extends ZodRawShape = ZodRawShape> extends ZodTypeDef {
        typeName: ZodFirstPartyTypeKind.ZodObject;
        shape: () => T;
    }

    export type AnyZodObject = ZodObject<any>;

    // Array
    export interface ZodArray<T extends ZodTypeAny> extends ZodType<Array<T["_output"]>, ZodArrayDef<T>, Array<T["_input"]>> {
        element: T;
        min(minLength: number, message?: string): ZodArray<T>;
        max(maxLength: number, message?: string): ZodArray<T>;
        length(len: number, message?: string): ZodArray<T>;
        nonempty(message?: string): ZodArray<T>;
    }
    export interface ZodArrayDef<T extends ZodTypeAny = ZodTypeAny> extends ZodTypeDef {
        type: T;
        typeName: ZodFirstPartyTypeKind.ZodArray;
    }

    // Union
    export interface ZodUnion<T extends [ZodTypeAny, ...ZodTypeAny[]]> extends ZodType<T[number]["_output"], ZodUnionDef<T>, T[number]["_input"]> {
        options: T;
    }
    export interface ZodUnionDef<T extends [ZodTypeAny, ...ZodTypeAny[]] = [ZodTypeAny, ...ZodTypeAny[]]> extends ZodTypeDef {
        options: T;
        typeName: ZodFirstPartyTypeKind.ZodUnion;
    }

    // Optional
    export interface ZodOptional<T extends ZodTypeAny> extends ZodType<T["_output"] | undefined, ZodOptionalDef<T>, T["_input"] | undefined> {
        unwrap(): T;
    }
    export interface ZodOptionalDef<T extends ZodTypeAny = ZodTypeAny> extends ZodTypeDef {
        innerType: T;
        typeName: ZodFirstPartyTypeKind.ZodOptional;
    }

    // Nullable
    export interface ZodNullable<T extends ZodTypeAny> extends ZodType<T["_output"] | null, ZodNullableDef<T>, T["_input"] | null> {
        unwrap(): T;
    }
    export interface ZodNullableDef<T extends ZodTypeAny = ZodTypeAny> extends ZodTypeDef {
        innerType: T;
        typeName: ZodFirstPartyTypeKind.ZodNullable;
    }

    // Nullish (Optional + Nullable)
    export interface ZodNullish<T extends ZodTypeAny> extends ZodType<T["_output"] | null | undefined, ZodNullishDef<T>, T["_input"] | null | undefined> {}
    export interface ZodNullishDef<T extends ZodTypeAny = ZodTypeAny> extends ZodTypeDef {
        innerType: T;
    }

    // Effects (refinements)
    export interface ZodEffects<T extends ZodTypeAny, Output = T["_output"], Input = T["_input"]> extends ZodType<Output, ZodEffectsDef<T>, Input> {
        sourceType(): T;
    }
    export interface ZodEffectsDef<T extends ZodTypeAny = ZodTypeAny> extends ZodTypeDef {
        schema: T;
        typeName: ZodFirstPartyTypeKind.ZodEffects;
    }

    // Intersection
    export interface ZodIntersection<T extends ZodTypeAny, U extends ZodTypeAny> extends ZodType<T["_output"] & U["_output"], ZodIntersectionDef<T, U>, T["_input"] & U["_input"]> {}
    export interface ZodIntersectionDef<T extends ZodTypeAny = ZodTypeAny, U extends ZodTypeAny = ZodTypeAny> extends ZodTypeDef {
        left: T;
        right: U;
    }

    // Factory functions - the main z object
    export const z: {
        string(): ZodString;
        number(): ZodNumber;
        boolean(): ZodBoolean;
        date(): ZodDate;
        object<T extends ZodRawShape>(shape: T): ZodObject<T>;
        array<T extends ZodTypeAny>(schema: T): ZodArray<T>;
        union<T extends [ZodTypeAny, ...ZodTypeAny[]]>(types: T): ZodUnion<T>;
        intersection<T extends ZodTypeAny, U extends ZodTypeAny>(left: T, right: U): ZodIntersection<T, U>;
        literal<T extends Primitive>(value: T): ZodLiteral<T>;
        enum<T extends [string, ...string[]]>(values: T): ZodEnum<T>;
        nativeEnum<T extends Record<string, string | number>>(enumObject: T): ZodNativeEnum<T>;
        optional<T extends ZodTypeAny>(schema: T): ZodOptional<T>;
        nullable<T extends ZodTypeAny>(schema: T): ZodNullable<T>;
        void(): ZodVoid;
        undefined(): ZodUndefined;
        null(): ZodNull;
        any(): ZodAny;
        unknown(): ZodUnknown;
        never(): ZodNever;
        tuple<T extends [ZodTypeAny, ...ZodTypeAny[]]>(schemas: T): ZodTuple<T>;
        record<T extends ZodTypeAny>(valueSchema: T): ZodRecord<ZodString, T>;
        record<K extends ZodTypeAny, T extends ZodTypeAny>(keySchema: K, valueSchema: T): ZodRecord<K, T>;
        map<K extends ZodTypeAny, V extends ZodTypeAny>(keySchema: K, valueSchema: V): ZodMap<K, V>;
        set<T extends ZodTypeAny>(valueSchema: T): ZodSet<T>;
        function<T extends ZodTuple<any, any>, U extends ZodTypeAny>(args: T, returns: U): ZodFunction<T, U>;
        lazy<T extends ZodTypeAny>(getter: () => T): ZodLazy<T>;
        preprocess<I, O>(preprocess: (arg: I) => O, schema: ZodType<any, any, O>): ZodEffects<ZodType<any, any, O>, any, I>;
        infer<T extends ZodType<any, any, any>>(schema: T): T["_output"];
    };

    // Type inference helper
    export type infer<T extends ZodType<any, any, any>> = T["_output"];

    // Additional types for completeness
    export type Primitive = string | number | boolean | bigint | symbol | undefined | null;
    export interface ZodLiteral<T extends Primitive> extends ZodType<T> {}
    export interface ZodEnum<T extends [string, ...string[]]> extends ZodType<T[number]> {}
    export interface ZodNativeEnum<T extends Record<string, string | number>> extends ZodType<T[keyof T]> {}
    export interface ZodVoid extends ZodType<void> {}
    export interface ZodUndefined extends ZodType<undefined> {}
    export interface ZodNull extends ZodType<null> {}
    export interface ZodAny extends ZodType<any> {}
    export interface ZodUnknown extends ZodType<unknown> {}
    export interface ZodNever extends ZodType<never> {}
    export interface ZodTuple<T extends [ZodTypeAny, ...ZodTypeAny[]]> extends ZodType<{ [k in keyof T]: T[k]["_output"] }> {}
    export interface ZodRecord<K extends ZodTypeAny, T extends ZodTypeAny> extends ZodType<Record<K["_output"], T["_output"]>> {}
    export interface ZodMap<K extends ZodTypeAny, V extends ZodTypeAny> extends ZodType<Map<K["_output"], V["_output"]>> {}
    export interface ZodSet<T extends ZodTypeAny> extends ZodType<Set<T["_output"]>> {}
    export interface ZodFunction<T extends ZodTuple<any, any>, U extends ZodTypeAny> extends ZodType<(...args: T["_output"]) => U["_output"]> {}
    export interface ZodLazy<T extends ZodTypeAny> extends ZodType<T["_output"], ZodLazyDef<T>, T["_input"]> {}
    export interface ZodLazyDef<T extends ZodTypeAny = ZodTypeAny> extends ZodTypeDef {
        getter: () => T;
    }
}
`;
                
                try {
                    // Add Zod types to this specific Monaco instance
                    monaco.languages.typescript.typescriptDefaults.addExtraLib(
                        zodTypes,
                        'file:///node_modules/zod/index.d.ts'
                    );
                    console.log('[TS-File] ✅ Zod types added to Monaco editor');
                    
                    // Force Monaco to refresh its language service and IntelliSense
                    setTimeout(() => {
                        try {
                            monaco.languages.typescript.getTypeScriptWorker().then(function(worker) {
                                console.log('[TS-File] TypeScript worker refreshed for IntelliSense');
                            });
                        } catch (workerError) {
                            console.log('[TS-File] Worker refresh error (this is normal):', workerError);
                        }
                    }, 500);
                    
                } catch (error) {
                    console.error('[TS-File] Failed to add Zod types:', error);
                }
            };

            // Build TypeScript editor with proper configuration
            var buildEditor = function(element, value) {
                console.log('[TS-File] Building TypeScript editor...');
                
                // Create a proper TypeScript model with .ts extension and unique URI
                const timestamp = Date.now();
                const modelUri = monaco.Uri.parse(`file:///typescript-file-${timestamp}.ts`);
                
                // Dispose any existing models to avoid conflicts
                monaco.editor.getModels().forEach(model => {
                    if (model.uri.path.includes('typescript-file')) {
                        model.dispose();
                    }
                });
                
                // Create new TypeScript model
                const model = monaco.editor.createModel(value, 'typescript', modelUri);
                console.log('[TS-File] Created TypeScript model with URI:', modelUri.toString());
                
                var editor = RED.editor.createEditor({
                    element: element,
                    model: model,
                    minimap: { enabled: false },
                    fontSize: 14,
                    scrollBeyondLastLine: false,
                    automaticLayout: true,
                    language: 'typescript'
                });

                // Ensure TypeScript worker is connected
                setTimeout(() => {
                    monaco.languages.typescript.getTypeScriptWorker().then(worker => {
                        return worker(modelUri).then(client => {
                            console.log('[TS-File] TypeScript worker connected to model');
                            
                            // Force initial validation
                            client.getSyntacticDiagnostics(modelUri.toString()).then(diagnostics => {
                                console.log('[TS-File] Initial syntax diagnostics:', diagnostics.length);
                            });
                            
                            client.getSemanticDiagnostics(modelUri.toString()).then(diagnostics => {
                                console.log('[TS-File] Initial semantic diagnostics:', diagnostics.length);
                            });
                        });
                    }).catch(error => {
                        console.error('[TS-File] TypeScript worker error:', error);
                    });
                }, 500);

                // Configure TypeScript-specific editor options
                editor.updateOptions({
                    quickSuggestions: {
                        other: true,
                        comments: false,
                        strings: false
                    },
                    parameterHints: { enabled: true },
                    suggestOnTriggerCharacters: true,
                    acceptSuggestionOnCommitCharacter: true,
                    snippetSuggestions: 'inline',
                    wordBasedSuggestions: false,
                    hover: { enabled: true },
                    semanticHighlighting: { enabled: true }
                });
                
                // Ensure popular types are available for IntelliSense
                console.log('[TS-File] Adding popular package types to editor...');
                addPopularTypesToEditor();
                
                console.log('[TS-File] TypeScript editor configured');
                return editor;
            };

            // Create the main content editor
            this.editor = buildEditor($("#node-input-content-editor")[0], this.content);
            
            // Load userDir types
            setTimeout(() => {
                if (RED.editor.types && RED.editor.types.typescript) {
                    console.log('[TS-File] Loading userDir types...');
                    RED.editor.types.typescript.loadUserDirTypes().then(files => {
                        console.log(`[TS-File] Loaded ${files.length} userDir TypeScript files`);
                    });
                }
            }, 1000);

            // Add validate button
            var validateBtn = $('<button type="button" class="red-ui-button red-ui-button-small" style="float: right; margin: 5px;">Validate TypeScript</button>');
            $("#node-input-content-editor").before(validateBtn);
            
            validateBtn.click(function() {
                var code = that.editor.getModel().getValue();
                $.ajax({
                    url: "function/typescript/compile",
                    type: "POST",
                    data: JSON.stringify({ code: code }),
                    contentType: "application/json",
                    success: function(result) {
                        console.log('[TS-File] Validation result:', result);
                        
                        if (result.errors && result.errors.length > 0) {
                            var errorDetails = result.errors.map(function(error) {
                                return `Line ${error.line}, Column ${error.column}: ${error.message}`;
                            }).join('\n');
                            
                            RED.notify(`TypeScript validation failed with ${result.errors.length} error(s):\n${errorDetails}`, "error");
                        } else if (result.warnings && result.warnings > 0) {
                            RED.notify(`TypeScript validation successful with ${result.warnings} warning(s)!`, "warning");
                        } else {
                            RED.notify("TypeScript validation successful - no errors or warnings!", "success");
                        }
                    },
                    error: function(xhr) {
                        console.error('[TS-File] Validation request failed:', xhr);
                        RED.notify("TypeScript validation request failed: " + xhr.responseText, "error");
                    }
                });
            });

            // File path input validation
            $("#node-input-filePath").on('blur', function() {
                var filePath = $(this).val();
                if (!filePath) {
                    RED.notify("File path is required", "error");
                    return;
                }
                
                if (!filePath.endsWith('.ts') && !filePath.endsWith('.tsx')) {
                    RED.notify("File path should end with .ts or .tsx", "warning");
                }
                
                // Show current path in label preview
                var label = that.name || `TS File: ${filePath}`;
                console.log('[TS-File] File path updated to:', filePath);
            });
        },
        oneditsave: function() {
            this.content = this.editor.getModel().getValue();
            this.editor.dispose();
            delete this.editor;
            
            console.log('[TS-File] Saved content for file:', this.filePath);
        },
        oneditcancel: function() {
            this.editor.dispose();
            delete this.editor;
        },
        oneditresize: function(size) {
            var height = size.height;
            $("#node-input-content-editor").css("height", Math.max(height - 120, 400) + "px");
            if (this.editor) {
                this.editor.layout();
            }
        }
    });
</script>

<script type="text/html" data-help-name="typescript-file">
    <p>A TypeScript file writer node that allows you to create and edit TypeScript files directly in Node-RED and save them to your userDir.</p>
    
    <h3>Features</h3>
    <ul>
        <li>Full TypeScript syntax support with type checking</li>
        <li>IntelliSense and auto-completion</li>
        <li>Real-time error highlighting</li>
        <li>Automatically saves content to file on deploy</li>
        <li>Files can be imported in TypeScript function nodes using <code>@userDir/</code></li>
    </ul>
    
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Name <span class="property-type">string</span></dt>
        <dd>Optional name for the node</dd>
        
        <dt>File Path <span class="property-type">string</span></dt>
        <dd>Path relative to userDir where the file should be saved (e.g., "lib/schemas.ts")</dd>
        
        <dt>TypeScript Content <span class="property-type">string</span></dt>
        <dd>The TypeScript code to save to the file</dd>
    </dl>
    
    <h3>Usage</h3>
    <p>This node has no inputs or outputs - it's a configuration-only node that saves TypeScript content to files.</p>
    
    <h4>1. Create Schema File</h4>
    <p>Set the file path to <code>lib/schemas.ts</code> and define your interfaces:</p>
    <pre>export interface User {
    id: string;
    name: string;
    email: string;
    age?: number;
}

export interface CreateUser {
    name: string;
    email: string;
    age?: number;
}

export enum UserRole {
    ADMIN = 'admin',
    USER = 'user',
    MODERATOR = 'moderator'
}</pre>
    
    <h4>2. Use in TypeScript Function Node</h4>
    <p>Import and use the types in your TypeScript function nodes:</p>
    <pre>import { User, CreateUser, UserRole } from '@userDir/lib/schemas';

export default function(msg: NodeMessage): NodeMessage {
    const newUser: User = {
        id: "123",
        name: "John Doe",
        email: "john@example.com",
        age: 30
    };
    
    msg.payload = newUser;
    return msg;
}</pre>
    
    <h4>3. With Zod Validation</h4>
    <p>You can also create Zod schemas for runtime validation:</p>
    <pre>import { z } from 'zod';

export const UserSchema = z.object({
    id: z.string(),
    name: z.string().min(1),
    email: z.string().email(),
    age: z.number().positive().optional()
});

export type User = z.infer<typeof UserSchema>;

export const CreateUserSchema = UserSchema.omit({ id: true });
export type CreateUser = z.infer<typeof CreateUserSchema>;</pre>
    
    <h3>File Organization</h3>
    <p>Organize your TypeScript files for better maintainability:</p>
    <ul>
        <li><code>lib/schemas.ts</code> - Type definitions and interfaces</li>
        <li><code>lib/validators.ts</code> - Zod schemas and validation functions</li>
        <li><code>lib/helpers.ts</code> - Utility functions</li>
        <li><code>lib/constants.ts</code> - Application constants</li>
    </ul>
    
    <h3>Notes</h3>
    <ul>
        <li>Files are saved when the flow is deployed</li>
        <li>The node will create directories as needed</li>
        <li>Use <code>.ts</code> extension for TypeScript files</li>
        <li>Changes are immediately available to TypeScript function nodes after deploy</li>
        <li>Validation helps catch TypeScript errors before saving</li>
    </ul>
</script>
