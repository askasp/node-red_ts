<script type="text/x-red" data-template-name="schema">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]common.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-schemaName"><i class="fa fa-code"></i> Schema Name</label>
        <input type="text" id="node-input-schemaName" placeholder="UserSchema">
    </div>
    <div class="form-row">
        <label for="node-input-export">&nbsp;</label>
        <input type="checkbox" id="node-input-export" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-export" style="width: 70%;">Export globally for reuse</label>
    </div>
    <div class="form-row" style="margin-bottom: 0px;">
        <label for="node-input-schemaCode"><i class="fa fa-code"></i> Schema Definition</label>
        <input type="hidden" id="node-input-schemaCode" autofocus="autofocus">
    </div>
    <div class="form-row node-text-editor-row">
        <div style="height: 300px; min-height:200px;" class="node-text-editor" id="node-input-schema-editor"></div>
    </div>
    <div class="form-tips">
        <p><strong>Define Zod schemas in TypeScript:</strong></p>
        <p>Use <code>z</code> to access Zod validation functions. The schema will validate <code>msg.payload</code>.</p>
        <p>When exported globally, other nodes can access this schema for validation.</p>
    </div>
</script>

<script type="text/x-red" data-help-name="schema">
    <p>A TypeScript-based schema validation node using Zod.</p>
    <p>This node allows you to define type-safe validation schemas that can validate and transform message payloads.</p>
    
    <h3>Configuration</h3>
    <ul>
        <li><strong>Schema Name:</strong> A unique name for this schema</li>
        <li><strong>Export globally:</strong> Make this schema available to other nodes</li>
        <li><strong>Schema Definition:</strong> TypeScript code defining the Zod schema</li>
    </ul>

    <h3>Schema Definition</h3>
    <p>Write TypeScript code using Zod to define your validation schema:</p>
    <pre>
const schema = z.object({
    name: z.string().min(1),
    age: z.number().min(0).max(120),
    email: z.string().email(),
    preferences: z.object({
        theme: z.enum(['light', 'dark']),
        notifications: z.boolean().default(true)
    }).optional()
});
    </pre>

    <h3>Behavior</h3>
    <ul>
        <li>Validates <code>msg.payload</code> against the defined schema</li>
        <li>On success: passes through validated/transformed data</li>
        <li>On failure: adds validation errors to <code>msg._validation</code></li>
        <li>Exported schemas can be imported in function nodes</li>
    </ul>

    <h3>Using Exported Schemas</h3>
    <p>In function nodes, access exported schemas:</p>
    <pre>
// Get exported schema from global context
const schemas = global.get('__nodeRedSchemas') || {};
const UserSchema = schemas.UserSchema;

if (UserSchema) {
    const user = UserSchema.parse(msg.payload);
    // Use validated user data
}
    </pre>

    <h3>Validation Metadata</h3>
    <p>The node adds validation information to <code>msg._validation</code>:</p>
    <ul>
        <li><code>schema</code>: Name of the schema used</li>
        <li><code>validated</code>: Boolean indicating success/failure</li>
        <li><code>errors</code>: Array of validation errors (if any)</li>
        <li><code>timestamp</code>: When validation occurred</li>
    </ul>
</script>

<script type="text/javascript">
    RED.nodes.registerType('schema', {
        category: 'function',
        color: "#E7E7AE",
        defaults: {
            name: {value: ""},
            schemaName: {value: ""},
            schemaCode: {value: "const schema = z.object({\n    // Define your schema here\n    payload: z.any()\n});"},
            export: {value: false}
        },
        inputs: 1,
        outputs: 1,
        icon: "function.svg",
        label: function() {
            return this.name || this.schemaName || "schema";
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function() {
            var that = this;

            // Initialize the code editor
            this.editor = RED.editor.createEditor({
                id: 'node-input-schema-editor',
                mode: 'ace/mode/typescript',
                value: $("#node-input-schemaCode").val(),
                globals: {
                    z: true,
                    zod: true,
                    console: true
                }
            });

            // Setup Monaco TypeScript if available
            if (window.monaco) {
                this.setupMonacoTypeScript();
            }

            this.editor.focus();
        },
        setupMonacoTypeScript: function() {
            if (!window.monaco) return;

            // Add Zod type definitions
            var zodTypes = `
declare module 'zod' {
    export interface ZodType<Output = any, Def extends ZodTypeDef = ZodTypeDef, Input = Output> {
        parse(input: unknown): Output;
        safeParse(input: unknown): { success: true; data: Output } | { success: false; error: ZodError };
        optional(): ZodOptional<this>;
        nullable(): ZodNullable<this>;
        default(value: Output): ZodDefault<this>;
    }

    export interface ZodObject<T extends ZodRawShape> extends ZodType<ObjectType<T>> {
        shape: T;
        partial(): ZodObject<{ [K in keyof T]: ZodOptional<T[K]> }>;
        pick<Mask extends { [K in keyof T]?: true }>(mask: Mask): ZodObject<Pick<T, keyof Mask>>;
        omit<Mask extends { [K in keyof T]?: true }>(mask: Mask): ZodObject<Omit<T, keyof Mask>>;
    }

    export interface ZodString extends ZodType<string> {
        min(minLength: number, message?: string): this;
        max(maxLength: number, message?: string): this;
        length(length: number, message?: string): this;
        email(message?: string): this;
        url(message?: string): this;
        uuid(message?: string): this;
        regex(regexp: RegExp, message?: string): this;
    }

    export interface ZodNumber extends ZodType<number> {
        min(minimum: number, message?: string): this;
        max(maximum: number, message?: string): this;
        int(message?: string): this;
        positive(message?: string): this;
        negative(message?: string): this;
        nonnegative(message?: string): this;
        nonpositive(message?: string): this;
    }

    export interface ZodArray<T extends ZodTypeAny> extends ZodType<Array<T['_output']>> {
        element: T;
        min(minLength: number, message?: string): this;
        max(maxLength: number, message?: string): this;
        length(length: number, message?: string): this;
        nonempty(message?: string): this;
    }

    export function object<T extends ZodRawShape>(shape: T): ZodObject<T>;
    export function string(): ZodString;
    export function number(): ZodNumber;
    export function boolean(): ZodType<boolean>;
    export function date(): ZodType<Date>;
    export function array<T extends ZodTypeAny>(schema: T): ZodArray<T>;
    export function enum<T extends string>(values: readonly [T, ...T[]]): ZodType<T>;
    export function literal<T extends Primitive>(value: T): ZodType<T>;
    export function union<T extends readonly [ZodTypeAny, ...ZodTypeAny[]]>(types: T): ZodUnion<T>;
    export function any(): ZodType<any>;
    export function unknown(): ZodType<unknown>;
    export function never(): ZodType<never>;
    export function void(): ZodType<void>;
    export function null(): ZodType<null>;
    export function undefined(): ZodType<undefined>;

    // Helper types
    export type ZodRawShape = { [k: string]: ZodTypeAny };
    export type ZodTypeAny = ZodType<any, any, any>;
    export type ZodTypeDef = { [k: string]: any };
    export type Primitive = string | number | boolean | null | undefined;
    export type ObjectType<T extends ZodRawShape> = { [K in keyof T]: T[K]['_output'] };
    
    export interface ZodError extends Error {
        errors: Array<{
            path: (string | number)[];
            message: string;
            code: string;
        }>;
    }
}

declare var z: typeof import('zod');
declare var zod: typeof import('zod');
`;

            window.monaco.languages.typescript.typescriptDefaults.addExtraLib(
                zodTypes,
                'file:///node_modules/@types/zod/index.d.ts'
            );

            // Configure TypeScript compiler options
            window.monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
                target: window.monaco.languages.typescript.ScriptTarget.ES2020,
                module: window.monaco.languages.typescript.ModuleKind.CommonJS,
                moduleResolution: window.monaco.languages.typescript.ModuleResolutionKind.NodeJs,
                allowNonTsExtensions: true,
                strict: false,
                esModuleInterop: true,
                skipLibCheck: true
            });
        },
        oneditsave: function() {
            $("#node-input-schemaCode").val(this.editor.getValue());
            this.editor.destroy();
            delete this.editor;
        },
        oneditcancel: function() {
            this.editor.destroy();
            delete this.editor;
        },
        oneditresize: function(size) {
            var rows = $("#dialog-form>div:not(.node-text-editor-row)");
            var height = $("#dialog-form").height();
            for (var i = 0; i < rows.size(); i++) {
                height -= $(rows[i]).outerHeight(true);
            }
            var editorRow = $("#dialog-form>div.node-text-editor-row");
            height -= (parseInt(editorRow.css("marginTop")) + parseInt(editorRow.css("marginBottom")));
            $(".node-text-editor").css("height", height + "px");
            this.editor.resize();
        }
    });
</script>
